<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Main Navigation</title>
  <script type="importmap">
      {
        "imports": {
          "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.18), transparent 30%),
        radial-gradient(circle at 85% 15%, rgba(217, 70, 239, 0.16), transparent 30%),
        linear-gradient(135deg, #050712, #090a12 48%, #02030a);
      color: #f8fafc;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
    }

    .clip-source {
      position: absolute;
      width: 0;
      height: 0;
    }

    .ghost-cursor {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .top-nav {
      position: fixed;
      top: 1rem;
      left: 50%;
      z-index: 10;
      width: min(1120px, calc(100% - 2rem));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 0.65rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      background: rgba(5, 8, 18, 0.58);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(22px);
    }

    .brand {
      position: absolute;
      left: 0.65rem;
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      min-width: max-content;
      padding-left: 0.45rem;
      color: white;
      text-decoration: none;
      font-weight: 900;
      letter-spacing: 0;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, #020617 0 62%, transparent 63%),
        conic-gradient(from 320deg, #22d3ee, #2563eb, #a855f7, #22d3ee);
      box-shadow:
        0 0 26px rgba(34, 211, 238, 0.4),
        0 0 42px rgba(168, 85, 247, 0.22),
        inset 0 0 18px rgba(0, 0, 0, 0.65);
      overflow: hidden;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      display: block;
      filter: drop-shadow(0 0 7px rgba(34, 211, 238, 0.82));
    }

    .brand-name {
      font-size: 1.05rem;
      background: linear-gradient(90deg, #ffffff, #93c5fd 55%, #c084fc);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .social-shell {
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
      padding: 0.5rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.2);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(24px);
    }

    .social-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .social-link {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--tone), white 24%);
      border-radius: 14px;
      clip-path: url(#squircleClip);
      color: white;
      background:
        radial-gradient(circle at 30% 18%, rgba(255, 255, 255, 0.28), transparent 32%),
        linear-gradient(135deg, color-mix(in srgb, var(--tone), white 10%), color-mix(in srgb, var(--tone), black 32%));
      box-shadow:
        0 12px 28px color-mix(in srgb, var(--tone), transparent 70%),
        inset 0 -8px 18px rgba(0, 0, 0, 0.24);
      text-decoration: none;
      transform: translateY(0) scale(1);
      transition:
        transform 220ms ease,
        box-shadow 220ms ease,
        filter 220ms ease;
    }

    .social-link:hover {
      transform: translateY(-8px) scale(1.1);
      filter: brightness(1.12);
      box-shadow:
        0 18px 42px color-mix(in srgb, var(--tone), transparent 52%),
        inset 0 -8px 18px rgba(0, 0, 0, 0.18);
    }

    .social-link svg {
      width: 32px;
      height: 32px;
    }

    .hero {
      position: relative;
      z-index: 3;
      min-height: 100vh;
      display: grid;
      align-content: center;
      justify-items: center;
      padding: 8rem 1.5rem 3rem;
      text-align: center;
    }

    .hero h1 {
      max-width: 980px;
      margin: 0;
      font-size: clamp(3.5rem, 11vw, 9rem);
      line-height: 0.88;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .hero p {
      max-width: 620px;
      margin: 1.35rem 0 0;
      color: rgba(255, 255, 255, 0.66);
      font-size: clamp(1rem, 2vw, 1.25rem);
      line-height: 1.6;
    }

    @media (max-width: 760px) {
      .top-nav {
        align-items: stretch;
        flex-direction: column;
      }

      .brand {
        justify-content: center;
        padding-left: 0;
      }

      .social-shell {
        justify-content: center;
      }
    }
  </style>

  <main class="hero">
    <h1>𝓦𝓔𝓛𝓒𝓞𝓜𝓔 𝓣𝓞 𝓒𝓞𝓓𝓔 𝓦𝓐𝓥𝓔</h1>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

    const host = document.getElementById("ghost-cursor");

    // Configuration Extracted from App.tsx Component parameters
    const trailLength = 20;
    const inertia = 0.4;
    const grainIntensity = 0.05;
    const bloomStrength = 0.5;
    const bloomRadius = 0.7;
    const bloomThreshold = 0;
    const brightness = 1.2;
    const color = '#B19EEF';
    const edgeIntensity = 0;
    const maxDevicePixelRatio = 0.5;
    const fadeDelay = 200;
    const fadeDuration = 1000;

    const isTouch = ('ontouchstart' in window || navigator.maxTouchPoints > 0);
    const pixelBudget = isTouch ? 0.9e6 : 1.3e6;

    const baseVertexShader = `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position, 1.0);
        }
      `;

    const fragmentShader = `
        uniform float iTime;
        uniform vec3  iResolution;
        uniform vec2  iMouse;
        uniform vec2  iPrevMouse[MAX_TRAIL_LENGTH];
        uniform float iOpacity;
        uniform float iScale;
        uniform vec3  iBaseColor;
        uniform float iBrightness;
        uniform float iEdgeIntensity;

        varying vec2  vUv;

        float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7))) * 43758.5453123); }

        float noise(vec2 p){
          vec2 i = floor(p), f = fract(p);
          f = f * f * (3. - 2. * f);
          return mix(mix(hash(i + vec2(0.,0.)), hash(i + vec2(1.,0.)), f.x),
                     mix(hash(i + vec2(0.,1.)), hash(i + vec2(1.,1.)), f.x), f.y);
        }

        float fbm(vec2 p){
          float v = 0.0;
          float a = 0.5;
          mat2 m = mat2(cos(0.5), sin(0.5), -sin(0.5), cos(0.5));
          for(int i=0;i<5;i++){
            v += a * noise(p);
            p = m * p * 2.0;
            a *= 0.5;
          }
          return v;
        }

        vec3 tint1(vec3 base){ return mix(base, vec3(1.0), 0.15); }
        vec3 tint2(vec3 base){ return mix(base, vec3(0.8, 0.9, 1.0), 0.25); }

        vec4 blob(vec2 p, vec2 mousePos, float intensity, float activity) {
          vec2 q = vec2(fbm(p * iScale + iTime * 0.1), fbm(p * iScale + vec2(5.2,1.3) + iTime * 0.1));
          vec2 r = vec2(fbm(p * iScale + q * 1.5 + iTime * 0.15), fbm(p * iScale + q * 1.5 + vec2(8.3,2.8) + iTime * 0.15));
          float smoke = fbm(p * iScale + r * 0.8);
          
          float radius = 0.5 + 0.3 * (1.0 / iScale);
          float distFactor = 1.0 - smoothstep(0.0, radius * activity, length(p - mousePos));
          float alpha = pow(smoke, 2.5) * distFactor;

          vec3 c1 = tint1(iBaseColor);
          vec3 c2 = tint2(iBaseColor);
          vec3 color = mix(c1, c2, sin(iTime * 0.5) * 0.5 + 0.5);

          return vec4(color * alpha * intensity, alpha * intensity);
        }

        void main() {
          vec2 uv = (gl_FragCoord.xy / iResolution.xy * 2.0 - 1.0) * vec2(iResolution.x / iResolution.y, 1.0);
          vec2 mouse = (iMouse * 2.0 - 1.0) * vec2(iResolution.x / iResolution.y, 1.0);
          
          vec3 colorAcc = vec3(0.0);
          float alphaAcc = 0.0;
          
          vec4 b = blob(uv, mouse, 1.0, iOpacity);
          colorAcc += b.rgb;
          alphaAcc += b.a;

          for (int i = 0; i < MAX_TRAIL_LENGTH; i++) {
            vec2 pm = (iPrevMouse[i] * 2.0 - 1.0) * vec2(iResolution.x / iResolution.y, 1.0);
            float t = 1.0 - float(i) / float(MAX_TRAIL_LENGTH);
            t = pow(t, 2.0);
            
            if (t > 0.01) {
              vec4 bt = blob(uv, pm, t * 0.8, iOpacity);
              colorAcc += bt.rgb;
              alphaAcc += bt.a;
            }
          }

          colorAcc *= iBrightness;
          
          vec2 uv01 = gl_FragCoord.xy / iResolution.xy;
          float edgeDist = min(min(uv01.x, 1.0 - uv01.x), min(uv01.y, 1.0 - uv01.y));
          float distFromEdge = clamp(edgeDist * 2.0, 0.0, 1.0);
          float k = clamp(iEdgeIntensity, 0.0, 1.0);
          float edgeMask = mix(1.0 - k, 1.0, distFromEdge);
          
          float outAlpha = clamp(alphaAcc * iOpacity * edgeMask, 0.0, 1.0);
          gl_FragColor = vec4(colorAcc, outAlpha);
        }
      `;

    const FilmGrainShader = {
      uniforms: {
        tDiffuse: { value: null },
        iTime: { value: 0 },
        intensity: { value: grainIntensity }
      },
      vertexShader: `
          varying vec2 vUv;
          void main(){
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
      fragmentShader: `
          uniform sampler2D tDiffuse;
          uniform float iTime;
          uniform float intensity;
          varying vec2 vUv;
          float hash1(float n){ return fract(sin(n)*43758.5453); }
          void main(){
            vec4 color = texture2D(tDiffuse, vUv);
            float n = hash1(vUv.x*1000.0 + vUv.y*2000.0 + iTime) * 2.0 - 1.0;
            color.rgb += n * intensity * color.rgb;
            gl_FragColor = color;
          }
        `
    };

    const UnpremultiplyPass = new ShaderPass({
      uniforms: { tDiffuse: { value: null } },
      vertexShader: `
          varying vec2 vUv;
          void main(){
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
      fragmentShader: `
          uniform sampler2D tDiffuse;
          varying vec2 vUv;
          void main(){
            vec4 c = texture2D(tDiffuse, vUv);
            float a = max(c.a, 1e-5);
            vec3 straight = c.rgb / a;
            gl_FragColor = vec4(clamp(straight, 0.0, 1.0), c.a);
          }
        `
    });

    function calculateScale(el) {
      const r = el.getBoundingClientRect();
      const base = 600;
      const current = Math.min(Math.max(1, r.width), Math.max(1, r.height));
      return Math.max(0.5, Math.min(2.0, current / base));
    }

    const renderer = new THREE.WebGLRenderer({
      antialias: !isTouch,
      alpha: true,
      depth: false,
      stencil: false,
      powerPreference: 'default',
      premultipliedAlpha: false,
      preserveDrawingBuffer: false
    });

    renderer.setClearColor(0x000000, 0);
    renderer.domElement.style.pointerEvents = 'none';
    renderer.domElement.style.display = 'block';
    renderer.domElement.style.width = '100%';
    renderer.domElement.style.height = '100%';
    renderer.domElement.style.background = 'transparent';

    host.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const geom = new THREE.PlaneGeometry(2, 2);

    const maxTrail = Math.max(1, Math.floor(trailLength));
    const trailBuf = Array.from({ length: maxTrail }, () => new THREE.Vector2(0.5, 0.5));
    let head = 0;

    const baseColor = new THREE.Color(color);
    const material = new THREE.ShaderMaterial({
      defines: { MAX_TRAIL_LENGTH: maxTrail },
      uniforms: {
        iTime: { value: 0 },
        iResolution: { value: new THREE.Vector3(1, 1, 1) },
        iMouse: { value: new THREE.Vector2(0.5, 0.5) },
        iPrevMouse: { value: trailBuf.map(v => v.clone()) },
        iOpacity: { value: 1.0 },
        iScale: { value: 1.0 },
        iBaseColor: { value: new THREE.Vector3(baseColor.r, baseColor.g, baseColor.b) },
        iBrightness: { value: brightness },
        iEdgeIntensity: { value: edgeIntensity }
      },
      vertexShader: baseVertexShader,
      fragmentShader,
      transparent: true,
      depthTest: false,
      depthWrite: false
    });

    const mesh = new THREE.Mesh(geom, material);
    scene.add(mesh);

    const composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    const bloomPass = new UnrealBloomPass(new THREE.Vector2(1, 1), bloomStrength, bloomRadius, bloomThreshold);
    composer.addPass(bloomPass);

    const filmPass = new ShaderPass(FilmGrainShader);
    composer.addPass(filmPass);

    composer.addPass(UnpremultiplyPass);

    const resize = () => {
      const rect = host.getBoundingClientRect();
      const cssW = Math.max(1, Math.floor(rect.width));
      const cssH = Math.max(1, Math.floor(rect.height));

      const currentDPR = Math.min(window.devicePixelRatio || 1, maxDevicePixelRatio);
      const need = cssW * cssH * currentDPR * currentDPR;
      const scale = need <= pixelBudget ? 1 : Math.max(0.5, Math.min(1, Math.sqrt(pixelBudget / Math.max(1, need))));

      const pixelRatio = currentDPR * scale;
      renderer.setPixelRatio(pixelRatio);
      renderer.setSize(cssW, cssH, false);
      if (composer.setPixelRatio) composer.setPixelRatio(pixelRatio);
      composer.setSize(cssW, cssH);

      const wpx = Math.max(1, Math.floor(cssW * pixelRatio));
      const hpx = Math.max(1, Math.floor(cssH * pixelRatio));

      material.uniforms.iResolution.value.set(wpx, hpx, 1);
      material.uniforms.iScale.value = calculateScale(host);
      bloomPass.setSize(wpx, hpx);
    };

    resize();
    const ro = new ResizeObserver(resize);
    ro.observe(host);

    const start = performance.now();
    let raf = null;
    let pointerActive = false;
    let running = false;
    let lastMoveTime = performance.now();
    let fadeOpacity = 1.0;
    const currentMouse = new THREE.Vector2(0.5, 0.5);
    const velocity = new THREE.Vector2(0, 0);

    const animate = () => {
      const now = performance.now();
      const t = (now - start) / 1000;

      if (pointerActive) {
        velocity.set(
          currentMouse.x - material.uniforms.iMouse.value.x,
          currentMouse.y - material.uniforms.iMouse.value.y
        );
        material.uniforms.iMouse.value.copy(currentMouse);
        fadeOpacity = 1.0;
      } else {
        velocity.multiplyScalar(inertia);
        if (velocity.lengthSq() > 1e-6) {
          material.uniforms.iMouse.value.add(velocity);
        }

        const dt = now - lastMoveTime;
        if (dt > fadeDelay) {
          const k = Math.min(1, (dt - fadeDelay) / fadeDuration);
          fadeOpacity = Math.max(0, 1 - k);
        }
      }

      head = (head + 1) % maxTrail;
      trailBuf[head].copy(material.uniforms.iMouse.value);

      const arr = material.uniforms.iPrevMouse.value;
      for (let i = 0; i < maxTrail; i++) {
        const srcIdx = (head - i + maxTrail) % maxTrail;
        arr[i].copy(trailBuf[srcIdx]);
      }

      material.uniforms.iOpacity.value = fadeOpacity;
      material.uniforms.iTime.value = t;
      filmPass.uniforms.iTime.value = t;

      composer.render();

      if (!pointerActive && fadeOpacity <= 0.001) {
        running = false;
        raf = null;
        return;
      }

      raf = requestAnimationFrame(animate);
    };

    const ensureLoop = () => {
      if (!running) {
        running = true;
        raf = requestAnimationFrame(animate);
      }
    };

    const onPointerMove = (e) => {
      const x = THREE.MathUtils.clamp((e.clientX) / window.innerWidth, 0, 1);
      const y = THREE.MathUtils.clamp(1 - (e.clientY) / window.innerHeight, 0, 1);

      currentMouse.set(x, y);
      pointerActive = true;
      lastMoveTime = performance.now();
      ensureLoop();
    };

    const onPointerEnter = () => {
      pointerActive = true;
      ensureLoop();
    };

    const onPointerLeave = () => {
      pointerActive = false;
      lastMoveTime = performance.now();
      ensureLoop();
    };

    window.addEventListener('pointermove', onPointerMove, { passive: true });
    window.addEventListener('pointerenter', onPointerEnter, { passive: true });
    window.addEventListener('pointerleave', onPointerLeave, { passive: true });

    ensureLoop();
  </script>
</body>

</html>
